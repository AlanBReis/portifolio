<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgPart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="brandPart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="payerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="successFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
    <filter id="softSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="1200" height="720" fill="url(#bgPart)"/>
  <circle cx="100" cy="120" r="160" fill="#bae6fd" opacity="0.4"/>
  <circle cx="1080" cy="600" r="200" fill="#ddd6fe" opacity="0.35"/>

  <!-- Browser chrome -->
  <rect x="60" y="50" width="1080" height="620" rx="16" fill="#ffffff" filter="url(#cardSh)"/>
  <rect x="60" y="50" width="1080" height="44" rx="16" fill="#f1f5f9"/>
  <rect x="60" y="78" width="1080" height="16" fill="#f1f5f9"/>
  <circle cx="84" cy="72" r="6" fill="#ff5f57"/>
  <circle cx="104" cy="72" r="6" fill="#febc2e"/>
  <circle cx="124" cy="72" r="6" fill="#28c840"/>
  <rect x="410" y="60" width="380" height="24" rx="12" fill="#e2e8f0"/>
  <text x="600" y="76" text-anchor="middle" font-size="11" fill="#64748b" font-weight="500">🔒 agendamento.odratendemaringa.com.br</text>

  <!-- Top brand bar -->
  <rect x="60" y="94" width="1080" height="60" fill="#ffffff"/>
  <rect x="60" y="153" width="1080" height="1" fill="#e2e8f0"/>
  <rect x="92" y="110" width="34" height="30" rx="8" fill="url(#brandPart)"/>
  <text x="109" y="131" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Dr</text>
  <text x="138" y="129" font-size="15" font-weight="700" fill="#0f172a">Dr. Atende — Maringá</text>
  <text x="138" y="144" font-size="10.5" font-weight="500" fill="#64748b" letter-spacing="1.5">AGENDAMENTO PARTICULAR</text>

  <!-- Right header chips -->
  <rect x="900" y="115" width="92" height="24" rx="12" fill="#dbeafe"/>
  <text x="946" y="131" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">⏱ Atendimento hoje</text>
  <rect x="1000" y="115" width="108" height="24" rx="12" fill="#ecfdf5"/>
  <circle cx="1015" cy="127" r="3.5" fill="#10b981"/>
  <text x="1058" y="131" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">Pagamento seguro</text>

  <!-- Title -->
  <text x="92" y="200" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Confirme seu agendamento particular</text>
  <text x="92" y="225" font-size="13.5" fill="#64748b">Reserve seu horário e finalize o pagamento direto pelo PIX, cartão ou boleto — tudo integrado ao WhatsApp da clínica.</text>

  <!-- Three column flow: appointment summary, payment, confirmation -->

  <!-- LEFT: Appointment card -->
  <g transform="translate(92, 252)">
    <rect x="0" y="0" width="320" height="350" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softSh)"/>
    <rect x="0" y="0" width="320" height="80" rx="14" fill="url(#brandPart)"/>
    <rect x="0" y="66" width="320" height="14" fill="url(#brandPart)"/>
    <text x="20" y="32" font-size="10.5" font-weight="700" fill="rgba(255,255,255,0.8)" letter-spacing="1.5">CONSULTA AGENDADA</text>
    <text x="20" y="56" font-size="18" font-weight="800" fill="#ffffff">Dra. Camila Ribeiro</text>
    <text x="20" y="73" font-size="11.5" fill="rgba(255,255,255,0.85)">Cardiologia · CRM-PR 41.872</text>

    <!-- Detail rows -->
    <g font-size="12" fill="#0f172a">
      <text x="20" y="118" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.8">DATA &amp; HORA</text>
      <text x="20" y="138" font-weight="700">Segunda · 18 de Maio · 14:30</text>

      <text x="20" y="166" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.8">UNIDADE</text>
      <text x="20" y="186" font-weight="700">Maringá Center — Sala 304</text>

      <text x="20" y="214" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.8">PACIENTE</text>
      <text x="20" y="234" font-weight="700">João A. Oliveira</text>
      <text x="20" y="250" font-size="11" fill="#64748b">CPF ••• .••• .•••-92</text>

      <text x="20" y="278" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.8">VALOR DA CONSULTA</text>
      <text x="20" y="306" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">R$ 320,00</text>
      <text x="148" y="306" font-size="11" fill="#10b981" font-weight="700">à vista no PIX -5%</text>
    </g>

    <!-- Reschedule link -->
    <rect x="20" y="322" width="120" height="14" fill="none"/>
    <text x="20" y="332" font-size="11" font-weight="600" fill="#4f46e5">← Alterar horário</text>
  </g>

  <!-- CENTER: Payment method -->
  <g transform="translate(440, 252)">
    <rect x="0" y="0" width="320" height="350" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#softSh)"/>
    <text x="20" y="30" font-size="13" font-weight="700" fill="#0f172a">Forma de pagamento</text>
    <text x="20" y="48" font-size="11" fill="#64748b">Processado por Payer · Ambiente seguro</text>

    <!-- PIX (selected) -->
    <rect x="20" y="64" width="280" height="60" rx="11" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="34" y="78" width="32" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="50" y="100" text-anchor="middle" font-size="16" font-weight="800" fill="#10b981">⚡</text>
    <text x="78" y="92" font-size="13" font-weight="700" fill="#0f172a">PIX</text>
    <text x="78" y="108" font-size="11" fill="#64748b">Aprovação instantânea · 5% off</text>
    <rect x="244" y="80" width="46" height="20" rx="10" fill="#dcfce7"/>
    <text x="267" y="94" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">-5%</text>
    <circle cx="288" cy="113" r="6" fill="#4f46e5"/>
    <text x="288" y="117" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">✓</text>

    <!-- Card -->
    <rect x="20" y="132" width="280" height="60" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="34" y="146" width="32" height="32" rx="7" fill="#f1f5f9"/>
    <text x="50" y="166" text-anchor="middle" font-size="14">💳</text>
    <text x="78" y="160" font-size="13" font-weight="700" fill="#0f172a">Cartão de crédito</text>
    <text x="78" y="176" font-size="11" fill="#64748b">Até 6x sem juros</text>
    <rect x="234" y="148" width="22" height="14" rx="3" fill="#1a1f71"/>
    <text x="245" y="159" text-anchor="middle" font-size="7" font-weight="800" fill="#ffffff">VISA</text>
    <circle cx="266" cy="155" r="6" fill="#eb001b"/>
    <circle cx="274" cy="155" r="6" fill="#f79e1b" opacity="0.85"/>
    <rect x="284" y="150" width="14" height="9" rx="2" fill="#fbbf24"/>

    <!-- Boleto -->
    <rect x="20" y="200" width="280" height="60" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="34" y="214" width="32" height="32" rx="7" fill="#f1f5f9"/>
    <g transform="translate(38, 220)" stroke="#0f172a" stroke-width="1.4">
      <line x1="2" y1="2" x2="2" y2="22"/>
      <line x1="6" y1="2" x2="6" y2="22"/>
      <line x1="12" y1="2" x2="12" y2="22"/>
      <line x1="16" y1="2" x2="16" y2="22"/>
      <line x1="20" y1="2" x2="20" y2="22"/>
    </g>
    <text x="78" y="228" font-size="13" font-weight="700" fill="#0f172a">Boleto bancário</text>
    <text x="78" y="244" font-size="11" fill="#64748b">Vence em 3 dias úteis</text>

    <!-- CTA -->
    <rect x="20" y="280" width="280" height="48" rx="100" fill="#0f172a"/>
    <text x="160" y="309" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Pagar R$ 304,00 com PIX  →</text>
  </g>

  <!-- RIGHT: Payer + ChatWoot pipeline -->
  <g transform="translate(788, 252)">
    <rect x="0" y="0" width="288" height="350" rx="14" fill="url(#payerGrad)"/>
    <text x="20" y="32" font-size="10.5" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="1.5">STACK DE PAGAMENTOS</text>

    <!-- Payer logo -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="248" height="68" rx="11" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)"/>
      <rect x="14" y="14" width="40" height="40" rx="9" fill="#10b981"/>
      <text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">P</text>
      <text x="64" y="35" font-size="14" font-weight="700" fill="#ffffff">Payer</text>
      <text x="64" y="51" font-size="10.5" fill="rgba(255,255,255,0.6)">Gateway de pagamento</text>
      <rect x="190" y="22" width="48" height="24" rx="12" fill="rgba(16,185,129,0.18)"/>
      <text x="214" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#34d399">ATIVO</text>
    </g>

    <!-- Pipeline -->
    <g transform="translate(20, 134)">
      <line x1="14" y1="14" x2="14" y2="172" stroke="rgba(255,255,255,0.15)" stroke-dasharray="3 3"/>

      <circle cx="14" cy="14" r="11" fill="#10b981"/>
      <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
      <text x="36" y="12" font-size="11.5" font-weight="700" fill="#ffffff">Cliente confirma horário</text>
      <text x="36" y="26" font-size="10.5" fill="rgba(255,255,255,0.55)">Site de agendamento</text>

      <circle cx="14" cy="60" r="11" fill="#10b981"/>
      <text x="14" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
      <text x="36" y="58" font-size="11.5" font-weight="700" fill="#ffffff">Pagamento via Payer</text>
      <text x="36" y="72" font-size="10.5" fill="rgba(255,255,255,0.55)">PIX · Cartão · Boleto</text>

      <circle cx="14" cy="106" r="11" fill="#10b981"/>
      <text x="14" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
      <text x="36" y="104" font-size="11.5" font-weight="700" fill="#ffffff">Webhook → ChatWoot</text>
      <text x="36" y="118" font-size="10.5" fill="rgba(255,255,255,0.55)">Conversa criada automaticamente</text>

      <circle cx="14" cy="152" r="11" fill="rgba(99,102,241,0.7)" stroke="#6366f1" stroke-width="2"/>
      <text x="14" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
      <text x="36" y="150" font-size="11.5" font-weight="700" fill="#ffffff">WhatsApp envia recibo</text>
      <text x="36" y="164" font-size="10.5" fill="rgba(255,255,255,0.55)">+ lembretes 24h e 1h antes</text>
    </g>

    <!-- Live indicator -->
    <rect x="20" y="312" width="248" height="22" rx="11" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)"/>
    <circle cx="36" cy="323" r="3.5" fill="#10b981"/>
    <circle cx="36" cy="323" r="6" fill="#10b981" opacity="0.4"/>
    <text x="50" y="327" font-size="10.5" font-weight="600" fill="#34d399">Pipeline operando · 99.8% uptime</text>
  </g>

  <!-- Footer -->
  <rect x="60" y="618" width="1080" height="52" rx="0" fill="#f8fafc"/>
  <rect x="60" y="618" width="1080" height="1" fill="#e2e8f0"/>
  <text x="92" y="649" font-size="11.5" font-weight="700" fill="#0f172a">🔐  Payer + ChatWoot + WhatsApp</text>
  <text x="320" y="649" font-size="11" fill="#64748b">· Fluxo end-to-end de agendamento e cobrança</text>
  <text x="1108" y="649" text-anchor="end" font-size="11" font-weight="600" fill="#0ea5e9">odratendemaringa.com.br</text>
</svg>
