  <text x="12" y="232" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">11</text>
  <text x="46" y="232" font-family="monospace" font-size="10" fill="#50fa7b">def</text>
  <text x="72" y="232" font-family="monospace" font-size="10" fill="#8be9fd"> enviar_confirmacao</text>
  <text x="215" y="232" font-family="monospace" font-size="10" fill="#f8f8f2">(phone, pedido):</text>
