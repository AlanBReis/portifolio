  <text x="12" y="72" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">1</text>
  <text x="46" y="72" font-family="monospace" font-size="10" fill="#6272a4"># Medformula — Chatbot WhatsApp</text>
