  <text x="46" y="248" font-family="monospace" font-size="10" fill="#f8f8f2">    payload = &#123;</text>
  <text x="12" y="264" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">13</text>
  <text x="46" y="264" font-family="monospace" font-size="10" fill="#f1fa8c">        "channel"</text>
  <text x="135" y="264" font-family="monospace" font-size="10" fill="#f8f8f2">: </text>
  <text x="148" y="264" font-family="monospace" font-size="10" fill="#f1fa8c">"whatsapp",</text>
  <text x="12" y="280" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">14</text>
  <text x="46" y="280" font-family="monospace" font-size="10" fill="#f1fa8c">        "destination"</text>
  <text x="155" y="280" font-family="monospace" font-size="10" fill="#f8f8f2">: phone,</text>
  <text x="12" y="296" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">15</text>
  <text x="46" y="296" font-family="monospace" font-size="10" fill="#f1fa8c">        "message"</text>
  <text x="127" y="296" font-family="monospace" font-size="10" fill="#f8f8f2">: confirmar_msg(pedido)</text>
  <text x="12" y="312" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">16</text>
  <text x="46" y="312" font-family="monospace" font-size="10" fill="#f8f8f2">    &#125;</text>
  <text x="12" y="328" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">17</text>
  <text x="46" y="328" font-family="monospace" font-size="10" fill="#8be9fd">    res</text>
  <text x="73" y="328" font-family="monospace" font-size="10" fill="#ff79c6"> = </text>
  <text x="90" y="328" font-family="monospace" font-size="10" fill="#f8f8f2">requests.</text>
  <text x="148" y="328" font-family="monospace" font-size="10" fill="#50fa7b">post</text>
  <text x="174" y="328" font-family="monospace" font-size="10" fill="#f8f8f2">(API_URL, json=payload,</text>
  <text x="12" y="344" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">18</text>
  <text x="46" y="344" font-family="monospace" font-size="10" fill="#f8f8f2">             headers=&#123;</text>
  <text x="148" y="344" font-family="monospace" font-size="10" fill="#f1fa8c">"apikey"</text>
  <text x="202" y="344" font-family="monospace" font-size="10" fill="#f8f8f2">: API_KEY&#125;)</text>
  <text x="12" y="360" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">19</text>
  <text x="46" y="360" font-family="monospace" font-size="10" fill="#ff79c6">    return</text>
