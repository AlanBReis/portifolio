  <text x="46" y="168" font-family="monospace" font-size="10" fill="#8be9fd">API_URL</text>
  <text x="118" y="168" font-family="monospace" font-size="10" fill="#ff79c6"> = </text>
  <text x="136" y="168" font-family="monospace" font-size="10" fill="#f1fa8c">"https://api.gupshup.io/sm/api"</text>
  <text x="12" y="184" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">8</text>
  <text x="46" y="184" font-family="monospace" font-size="10" fill="#8be9fd">API_KEY</text>
  <text x="116" y="184" font-family="monospace" font-size="10" fill="#ff79c6"> = </text>
  <text x="134" y="184" font-family="monospace" font-size="10" fill="#f1fa8c">os.getenv("GUPSHUP_KEY")</text>
  <text x="12" y="200" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.2)">9</text>
